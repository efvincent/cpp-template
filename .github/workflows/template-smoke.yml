name: Template Smoke Matrix

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            ui_type: plain
            imgui_backend: ""
          - name: ncurses
            ui_type: ncurses
            imgui_backend: ""
          - name: sdl3
            ui_type: sdl3
            imgui_backend: ""
          - name: imgui-vulkan
            ui_type: imgui
            imgui_backend: glfw_vulkan
          - name: imgui-opengl3
            ui_type: imgui
            imgui_backend: glfw_opengl3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            pkg-config \
            git \
            libncurses-dev \
            libsdl3-dev \
            libglfw3-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            bear

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate project from template
        env:
          VARIANT: ${{ matrix.name }}
          UI_TYPE: ${{ matrix.ui_type }}
          IMGUI_BACKEND: ${{ matrix.imgui_backend }}
        run: |
          out_dir="/tmp/smoke-${VARIANT}"
          rm -rf "${out_dir}"

          if [ -n "${IMGUI_BACKEND}" ]; then
            cargo generate --path ./template \
              --name "smoke-${VARIANT}" \
              --define project_description='CI smoke build' \
              --define ui_type="${UI_TYPE}" \
              --define imgui_backend="${IMGUI_BACKEND}" \
              --silent \
              --destination /tmp
          else
            cargo generate --path ./template \
              --name "smoke-${VARIANT}" \
              --define project_description='CI smoke build' \
              --define ui_type="${UI_TYPE}" \
              --silent \
              --destination /tmp
          fi

      - name: Build debug target
        env:
          VARIANT: ${{ matrix.name }}
        run: |
          cd "/tmp/smoke-${VARIANT}"
          make -j2

      - name: Build compile_commands.json
        env:
          VARIANT: ${{ matrix.name }}
        run: |
          cd "/tmp/smoke-${VARIANT}"
          make bear
          test -f compile_commands.json
